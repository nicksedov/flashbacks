version: 4

specifications:
  formats:
    markdown:
      package: "@focused-spec/format-markdown"
  documents:
    - match: openspec/specs/**/*.md
      scope: current
      format: markdown
    - match: openspec/changes/*/specs/**/*.md
      scope: current
      format: markdown

evidence:
  files:
    - .focused-spec/evidence.yaml

runners:
  vitest:
    package: "@focused-spec/runner-vitest"
    timeoutMs: 600000
  pytest:
    package: "@focused-spec/runner-pytest"
    options:
      command: uv
      commandArgs: ["run", "--with", "pytest", "python"]
    timeoutMs: 300000
  facespytest:
    package: "@focused-spec/runner-pytest"
    options:
      # The runner appends its own "-m pytest"; passing it again would make
      # pytest read the second one as a marker expression and deselect everything.
      command: backend/faces/.venv/bin/python
    timeoutMs: 600000
  go:
    package: "@focused-spec/runner-go"
    options:
      commandArgs: ["-C", "backend/core"]
    timeoutMs: 180000
  goregistry:
    package: "@focused-spec/runner-go"
    options:
      commandArgs: ["-C", "backend/registry"]
    timeoutMs: 180000
