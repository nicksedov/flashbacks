[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashbacks-faces"
version = "0.1.0"
description = "Face recognition microservice for Flashbacks (SCRFD detection, ArcFace embeddings, HDBSCAN clustering)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "insightface>=0.7.3",
  "onnxruntime>=1.19",
  "hdbscan>=0.8.39",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
