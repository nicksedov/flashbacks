openapi: "3.1.0"
info:
  title: Flashbacks Faces Service
  version: "0.1.0"
  description: |
    Face recognition microservice for Flashbacks. Runs SCRFD-10G detection,
    ArcFace (w600k_r50) embeddings, and DBSCAN clustering over REST.

servers:
  - url: http://localhost:5173
    description: Local development

paths:
  /faces/health:
    get:
      summary: Service health check
      operationId: getFacesHealth
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /faces/detect:
    post:
      summary: Detect faces in an image
      operationId: detectFaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
      responses:
        "200":
          description: Detected face boxes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
        "400":
          description: Invalid image payload

  /faces/analyze:
    post:
      summary: Detect and embed every face of an image
      description: |
        One model pass: returns every detected face with its box, detection
        confidence and embedding. This is the call the face recognition job uses,
        because embedding a face one request at a time re-runs detection over the
        whole image and made group photos exceed the request budget. Faces
        narrower than 64 px are re-embedded from an upscaled padded crop to keep
        small faces recognisable.
      operationId: analyzeFaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Every detected face with its embedding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Invalid image payload

  /faces/analyze-batch:
    post:
      summary: Detect and embed every face of several images in one request
      description: |
        One request covers many photos, so a GPU is kept busy between model
        submissions. The response carries exactly one entry per submitted image,
        in request order; an image that cannot be decoded produces an `error`
        entry while the other entries still carry their faces. Requests larger
        than `FACES_MAX_BATCH` are rejected before any model work.
      operationId: analyzeFacesBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeBatchRequest"
      responses:
        "200":
          description: One entry per submitted image, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeBatchResponse"
        "422":
          description: The batch exceeds the configured FACES_MAX_BATCH limit

  /faces/cluster-graph:
    post:
      summary: Cluster faces from a candidate-similarity graph
      description: |
        The caller queries pgvector for each unassigned face's neighbours inside
        the clustering radius and posts those candidate links instead of every
        embedding. The service keeps ownership of the calibrated thresholds — the
        strict floor (0.40), the recognition floor (0.25) and the runner-up margin
        (0.05) — and returns one label per submitted face id (`-1` when a face
        stays unassigned).
      operationId: clusterFacesGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterGraphRequest"
      responses:
        "200":
          description: One label per face id, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterGraphResponse"

  /faces/embed:
    post:
      summary: Embed a detected face
      description: |
        Faces are detected on the whole image; the optional `box` selects which
        detected face to embed (highest IoU with the box). Without a box the
        largest detected face is used. An empty `embedding` means no face was
        detected in the image or inside the requested box.
      operationId: embedFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: 512-d embedding vector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          description: Invalid image payload

  /faces/cluster:
    post:
      summary: Cluster face embeddings
      operationId: clusterFaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRequest"
      responses:
        "200":
          description: One cluster label per embedding (-1 for noise)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        activeProvider:
          type: string
          description: |
            Short name of the ONNX Runtime provider the model session runs on
            (`cpu`, `cuda`, `tensorrt`), after intersecting configuration with
            what the installed runtime offers.
        requestedProviders:
          type: array
          description: Configured providers in priority order, as short names.
          items:
            type: string
        devices:
          type: array
          description: |
            One entry per model session in the pool. A two-GPU host reports two
            devices; the CPU fallback reports a single device with id -1.
          items:
            type: object
            properties:
              deviceId:
                type: integer
              provider:
                type: string
        thresholds:
          type: object
          description: |
            The calibrated similarities the service applies, reported so callers
            do not keep their own copies.
          properties:
            clusterMinSimilarity:
              type: number
            recognitionMinSimilarity:
              type: number
            recognitionMargin:
              type: number
            minClusterableFacePx:
              type: number
              description: |
                Smallest face, measured by the smaller box side in stored pixels,
                that the service will cluster. A smaller face stays a detection:
                it is never labelled, never assigned to a person and never
                makes one. Core reads it to skip clustering such faces and to
                detach the ones already attached (`FACES_MIN_CLUSTERABLE_FACE_PX`,
                default 32).
            weakFacePx:
              type: number
              description: |
                Size from which a face is a full participant. Below it a face is
                *weak*: it may join a person but cannot found one, and it never
                becomes a person exemplar or a cover (64, i.e. `SMALL_FACE_WIDTH`).
            clusterAlgo:
              type: string
              enum:
                - graph-v1
                - graph-v2
              description: |
                The active labelling revision. `graph-v1` is the legacy single
                linkage; `graph-v2` is the density-aware variant.
            clusterCoreSimilarity:
              type: number
              description: |
                Hub-corrected (CSLS) mutual-neighbour floor of a core point
                (graph-v2). The scale differs from a raw cosine.
            clusterCoreNeighbours:
              type: integer
            clusterAssignSimilarity:
              type: number
              description: |
                Floor for assigning a face or a new cluster to an existing
                person, also used by core for its reference match.
            clusterMergeSimilarity:
              type: number
            clusterMergeSupport:
              type: integer
            clusterMergeSupportSimilarity:
              type: number
            clusterCandidatesPerPhoto:
              type: integer
            clusterMinPhotos:
              type: integer

    FaceBox:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        confidence:
          type: number

    DetectRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: Base64-encoded image bytes.

    DetectResponse:
      type: object
      properties:
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/FaceBox"

    AnalyzedFace:
      allOf:
        - $ref: "#/components/schemas/FaceBox"
        - type: object
          properties:
            embedding:
              type: array
              items:
                type: number

    AnalyzeRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: Base64-encoded image bytes.

    AnalyzeResponse:
      type: object
      properties:
        faces:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzedFace"

    AnalyzeBatchRequest:
      type: object
      required:
        - images
      properties:
        images:
          type: array
          minItems: 1
          items:
            type: string
            description: Base64-encoded image bytes.

    AnalyzeBatchEntry:
      type: object
      description: |
        The outcome of analysing one image of a batch; positionally aligned with
        the request so the caller never needs an id map.
      properties:
        faces:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzedFace"
        error:
          type: string
          description: |
            Set when this image failed to decode or analyse; the other entries
            still carry their faces.

    AnalyzeBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzeBatchEntry"

    EmbedRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: Base64-encoded image bytes.
        box:
          allOf:
            - $ref: "#/components/schemas/FaceBox"
          description: |
            Selects the detected face to embed — the one with the highest IoU
            against this box. Omit it to embed the largest detected face.

    EmbedResponse:
      type: object
      properties:
        embedding:
          type: array
          items:
            type: number

    ClusterRequest:
      type: object
      required:
        - embeddings
      properties:
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
        minClusterSize:
          type: integer
        soloFaces:
          type: array
          description: |
            One flag per embedding: true when the face is the only face of its
            photo. Such a portrait may anchor a new person for a face recognised
            from a group shot; a group-shot face alone never creates a person.
          items:
            type: boolean
        photoIds:
          type: array
          description: |
            Optional photo identity per embedding, aligned with `embeddings`.
            Absent means one unique photo per face, which keeps an older core's
            behaviour. Used by `graph-v2` for photo-diversity rules.
          items:
            type: integer
        widths:
          type: array
          description: |
            Size of each face in stored pixels, aligned with `embeddings`: the
            smaller box side (`min(width, height)`), which is the orientation-
            invariant measure because boxes live in the un-rotated frame. A face
            below `minClusterableFacePx` never receives a label; a face below
            `weakFacePx` cannot found a person.
          items:
            type: number
        qualities:
          type: array
          description: Optional detection confidence, aligned with `embeddings`.
          items:
            type: number

    ClusterResponse:
      type: object
      properties:
        labels:
          type: array
          items:
            type: integer

    FaceLink:
      type: object
      description: One candidate-similarity edge between two detected faces.
      required:
        - faceId
        - candidateId
        - similarity
      properties:
        faceId:
          type: integer
        candidateId:
          type: integer
        similarity:
          type: number
          description: Cosine similarity between the two face embeddings.

    ClusterGraphRequest:
      type: object
      required:
        - faceIds
        - edges
      properties:
        faceIds:
          type: array
          description: Every face to label, in the order the labels are returned.
          items:
            type: integer
        soloFaces:
          type: array
          description: |
            One flag per face id: true when the face is the only face of its
            photo. Such a portrait may anchor a new person; a group-shot face
            alone never creates one.
          items:
            type: boolean
        photoIds:
          type: array
          description: |
            Optional photo identity per face id, aligned with `faceIds`. Absent
            means one unique photo per face, which keeps an older core's
            behaviour. Used by `graph-v2` for photo-diversity rules.
          items:
            type: integer
        widths:
          type: array
          description: |
            Size of each face in stored pixels, aligned with `faceIds`: the
            smaller box side (`min(width, height)`), which is the
            orientation-invariant measure because boxes live in the un-rotated
            frame. A face below `minClusterableFacePx` is never labelled, and a
            face below `weakFacePx` cannot be a core point, so it can only join
            a person an existing full-size face founded.
          items:
            type: number
        qualities:
          type: array
          description: Optional detection confidence, aligned with `faceIds`.
          items:
            type: number
        edges:
          type: array
          description: |
            Candidate links inside the clustering radius, as answered by the
            vector store's nearest-neighbour query.
          items:
            $ref: "#/components/schemas/FaceLink"

    ClusterGraphResponse:
      type: object
      properties:
        labels:
          type: array
          description: One label per submitted face id (-1 for unassigned).
          items:
            type: integer
